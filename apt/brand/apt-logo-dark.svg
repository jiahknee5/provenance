<svg xmlns="http://www.w3.org/2000/svg" width="260" height="72" viewBox="0 0 260 72" role="img" aria-label="Apt logo (dark background)">
  <title>Apt — logo lockup for dark backgrounds</title>
  <defs>
    <linearGradient id="aptLockD" x1="10" y1="56" x2="56" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset=".55" stop-color="#8b7dff"/>
      <stop offset="1" stop-color="#3ee0c8"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#aptLockD)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(4,4)">
    <path d="M12 34 L25 46 L50 14"/>
    <path d="M39 12 L50 14 L48 25"/>
  </g>
  <text x="80" y="49" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif"
        font-size="46" font-weight="800" letter-spacing="-2" fill="#eef2fb">apt<tspan fill="url(#aptLockD)">.</tspan></text>
</svg>
