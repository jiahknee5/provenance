stages:
  - verify
  - deploy

default:
  image: python:3.11-slim
  tags:
    - provenance-pm
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install --cache-dir .cache/pip -r requirements.txt

test:
  stage: verify
  script:
    - python -m pytest -q

demo_artifacts:
  stage: verify
  script:
    - python -m scripts.pipeline
    - python -m scripts.trace
  artifacts:
    when: always
    paths:
      - data/demo/runs/
      - data/demo/observe/
    expire_in: 1 week

eval_monitoring:
  stage: verify
  allow_failure: true
  variables:
    EVAL_MODE: "deterministic"
    EVAL_LLM_ENABLED: "false"
    EVAL_LLM_MAX_CALLS: "0"
    EVAL_SAMPLE_LIMIT: "10"
    OPENROUTER_MODEL: "google/gemini-2.5-flash-lite"
    LANGFUSE_EXPORT: "false"
    CI_FAIL_ON_EVAL: "false"
  script:
    - python -m scripts.eval_monitoring
  artifacts:
    when: always
    paths:
      - eval-results/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: never

deploy_vps:
  stage: deploy
  image: alpine:3.20
  needs:
    - test
    - demo_artifacts
  variables:
    APP_ROOT: "/opt/provenance-pm"
    COMPOSE_PROJECT_NAME: "provenance-pm"
    VPS_PORT: "22"
  before_script:
    - apk add --no-cache bash curl openssh-client
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/deploy_key
    - printf '\n' >> ~/.ssh/deploy_key
    - chmod 400 ~/.ssh/deploy_key
    - ssh-add ~/.ssh/deploy_key
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - 'test -n "$VPS_HOST" || (echo "Set VPS_HOST in GitLab CI variables" && exit 1)'
    - 'test -n "$VPS_USER" || (echo "Set VPS_USER in GitLab CI variables" && exit 1)'
    - bash scripts/deploy-vps.sh
    - |
      base_url="${PROVENANCE_PM_URL:-https://apt.af5.org}"
      healthy=0

      for attempt in $(seq 1 30); do
        if curl -fsS "$base_url/healthz"; then
          healthy=1
          break
        fi

        sleep 2
      done

      if [ "$healthy" -ne 1 ]; then
        echo "Public health check failed for $base_url"
        exit 1
      fi
  environment:
    name: production
    url: https://apt.af5.org
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_TO_VPS == "true"'
