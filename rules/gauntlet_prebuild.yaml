# GauntletAI — image prebuild manifest (per surface).
# Which demo states scripts/warm_hero_cache.py pre-generates so image surfaces
# ship inside the deploy image (instant first paint).
# Loaded by pipeline.personalization.prebuild.load_prebuild_manifest().
#
# entry: ad (variant resolves UTMs from the catalog) | direct | search | email
# identity: anon | known (known_email below)
# prebuild: true  → generated by the warm script, baked into the deploy image
# prebuild: false → skipped by the warm script; first visitor generates realtime
#                   (gradient→swap, governed by the S3.3 daily spend ceiling)
#
# S3.3 [PANEL — locked] budget policy (T-06 reconciliation): prebuilt =
# EXPLICITLY flagged states only, hard caps K=8 states per image target,
# 24 baked images per tenant, 80 global. States referenced by
# rules/demo_scenarios.yaml fill the K slots first (direct/search/email pairs +
# ad v09 — the featured tour states). og carries its own explicit short list —
# no YAML-anchor mirroring of hero. scripts/warm_hero_cache.py --check fails
# the deploy gate if any cap is exceeded. Previously baked images stay served
# from data/demo/image_cache; nothing is regenerated by a flag change.
#
# Backward compat: flat ``states`` below is also hero; ``surfaces`` is canonical.

