# Planet — section registry (S1/R30, contract: 04-spec/contracts/registry-schema.md).
# T-01 behavior-neutral seed (Art IV): mirrors today's hardcoded slot() ids in
# pipeline/personalization/planet_site.py build_page and the hero/og image surfaces.
# DESCRIPTIVE ONLY at this wave — build_page does not read this file yet.
#
# The location section is Planet's differentiator (hero_location — the daily-coverage
# line, region scale only). region: research matches the build_page region key for the
# research callout (planet's analog of gauntlet's challenger section).
# Image workflows: hero/og/section_backdrop realtime; the location region_backdrop is
# prebuilt for the COMMON crop-belt regions — accounted in rules/planet_prebuild.yaml
# within the S3.3 caps (K=8/target). Long-tail regions stay realtime (P08).
#
# T-08 (W3): generative rows seeded per the WF-DESIGN matrix — P07 prove_intro_gen
# (gen, prebuilt pool), P10 cta_gen (gen, realtime cache-by-key), P02 region_backdrop
# (prebuilt image), P08 section_backdrop (realtime image). Generative slots serve ONLY
# from the Gate-cleared decision pool.

version: 1
tenant: planet
sections:
  - id: hero
    label: "Hero"
    placement: "Top of the page — the first screen every visitor sees"
    region: hero
    personalize: true
    goal: "Message-match the first screen to the arrival — campaign creative, identity, or firmographics."
    channels: [direct, search, ads, email]
    text_targets:
      - slot_id: hero_eyebrow
        label: "Hero eyebrow"
        mode: deterministic
        workflow: realtime
        strategy: message-match
        policy: say
        source: catalog
        claims: []
        prompt: ""
      - slot_id: hero_sub
        label: "Hero headline + sub"
        mode: deterministic
        workflow: realtime
        strategy: objection-reframe
        policy: say
        source: catalog
        claims: []
        prompt: ""
      - slot_id: hero_cta
        label: "Hero CTAs"
        mode: deterministic
        workflow: realtime
        strategy: message-match
        policy: allude
        source: catalog
        claims: []
        prompt: ""
    image_targets:
      - surface_id: hero
        label: "Hero background"
        workflow: realtime
        intent_rules: inherit
        guardrails: inherit
        prebuilt_states_cap: 8
      - surface_id: og
        label: "Open Graph / social preview"
        workflow: realtime
        intent_rules: inherit
        guardrails: inherit
        prebuilt_states_cap: 8
    guardrails: {}
    evals: [gate_pass, hold_never_ships, brain_score]
  - id: location
    label: "Location line"
    placement: "Inside the hero — the location line under the headline"
    region: location
    personalize: true
    goal: "The daily-coverage claim at region scale — never street or property scale; defense gets the theater register."
    channels: [direct, search, ads, email]
    text_targets:
      - slot_id: hero_location
        label: "Hero location line"
        mode: deterministic
        workflow: realtime
        strategy: location-relevance
        policy: allude
        source: catalog
        claims: []
        prompt: ""
    image_targets:
      - surface_id: region_backdrop
        label: "Region backdrop (crop-belt)"
        workflow: prebuilt
        intent_rules: inherit
        guardrails: inherit
        prebuilt_states_cap: 8
    guardrails: {}
    evals: [gate_pass, hold_never_ships]
  - id: prove
    label: "How we prove"
    placement: "Mid-page — the 'How we prove' evidence band"
    region: prove
    personalize: true
    goal: "Frame the proof model for the visitor's industry, region archive, or the ad promise they clicked."
    channels: [direct, search, ads, email]
    text_targets:
      - slot_id: prove_intro
        label: "How we prove intro"
        mode: deterministic
        workflow: realtime
        strategy: message-match
        policy: allude
        source: catalog
        claims: []
        prompt: ""
      - slot_id: prove_intro_gen
        label: "Prove intro (generative pool)"
        mode: generative
        workflow: prebuilt
        strategy: authority
        policy: allude
        source: catalog
        claims: []
        prompt: "Prove intro for enterprise agronomy contacts (declared goals ride at say level): authority framing bounded by approved claims — no superlatives, no competitor names, no invented numbers."
        gate: helix_tenant
    image_targets:
      - surface_id: section_backdrop
        label: "Prove section backdrop"
        workflow: realtime
        intent_rules: inherit
        guardrails: inherit
    guardrails: {}
    evals: [gate_pass, hold_never_ships]
  - id: research
    label: "Research callout"
    placement: "Mid-page — the research callout under the proof band"
    region: research
    personalize: true
    goal: "Meet the research-track visitor's objection in the callout body."
    channels: [direct, search, ads, email]
    text_targets:
      - slot_id: research_body
        label: "Research callout"
        mode: deterministic
        workflow: realtime
        strategy: objection-reframe
        policy: allude
        source: catalog
        claims: []
        prompt: ""
    image_targets: []
    guardrails: {}
    evals: [gate_pass, hold_never_ships]
  - id: compare
    label: "Task vs Monitor comparison"
    placement: "Lower page — the Task vs Monitor comparison table"
    region: compare
    personalize: true
    goal: "Emphasize the column and stat that match the audience — same facts for everyone."
    channels: [direct, search, ads, email]
    text_targets:
      - slot_id: compare_emphasis
        label: "Comparison table emphasis"
        mode: deterministic
        workflow: realtime
        strategy: message-match
        policy: allude
        source: catalog
        claims: []
        prompt: ""
      - slot_id: numbers_order
        label: "Stats emphasis order"
        mode: deterministic
        workflow: realtime
        strategy: message-match
        policy: allude
        source: catalog
        claims: []
        prompt: ""
    image_targets: []
    guardrails: {}
    evals: [gate_pass, hold_never_ships]
  - id: cta
    label: "Final CTA"
    placement: "Bottom of the page — the final call-to-action banner"
    region: cta
    personalize: true
    goal: "Steer the close with behavioral or location context — alluded to, never itemized."
    channels: [direct, search, ads, email]
    text_targets:
      - slot_id: final_cta
        label: "Final CTA block"
        mode: deterministic
        workflow: realtime
        strategy: objection-reframe
        policy: allude
        source: catalog
        claims: []
        prompt: ""
      - slot_id: cta_gen
        label: "CTA (generative, cache-by-key)"
        mode: generative
        workflow: realtime
        strategy: scarcity-honest
        policy: allude
        source: catalog
        claims: []
        prompt: "Closing CTA for returning known visitors: honest scarcity only — a scarcity claim without a provable deadline is dropped; no superlatives, no competitor names, no invented numbers."
        gate: helix_tenant
    image_targets: []
    guardrails: {}
    evals: [gate_pass, hold_never_ships]
