  # ── Gauntlet · hero · peer_proof ─────────────────────────────────────
  - id: gauntlet.hero.peer_proof.direct
    kind: image
    tenant: gauntlet
    surface: hero
    intent: peer_proof
    channel: direct
    audience: any
    sales_technique: "matched-peer social proof (Cialdini)"
    data_signals:
      - channel
      - audience_route
      - tier
    guardrails:
      tier_gates:
        industry: 2
        region_mood: 1
      must_avoid: from rules/gauntlet_image.yaml prompt_defaults.must_avoid
    prompt_template: |
      Cinematic wide hero backdrop for a {product}.
      Primary intent: {intent_id} — {conversion_goal}.
      Sales technique: {sales_technique}.
      Composition: Wide cinematic backdrop: {environment} at dusk, warm monitor glow suggesting
      peers already shipping — empty foreground for headline overlay, gold accent rim light.
      Visual metaphor: industry-matched engineering floor — capability implied by environment
      Mood: {mood}. Accent color {accent_color}.
      Must include: {must_include}.
      Must avoid: {must_avoid}.
      Drives action: {drives_action}.
    example_page_params: {}
    example_resolved: >-
      Cinematic wide hero backdrop for a AI engineering talent program marketing site. Primary intent: peer_proof — Trust → click CTA. Sales technique: matched-peer social proof (Cialdini). Composition: Wide cinematic backdrop: professional engineering workspace at dusk, warm monitor glow suggesting peers already shipping — empty foreground for headline overlay, gold accent rim light. Visual metaphor: industry-matched engineering floor — capability implied by environment Mood: credible, peer-aligned, calm confidence. Golden yellow accent lighting. audience_route (allude): neutral. Must include: cinematic wide 16:9 hero backdrop; dark moody atmosphere supporting headline overlay; warm gold accent lighting; single clear focal point — processing fluency; conversion goal: Trust → click CTA. Must avoid: NO faces of real people or identifiable individuals; NO company logos or brand marks; NO text, words, letters, or numbers in the image; NO visitor names, employer names, or PII; NO surveillance, creepy, or behavioral-tracking imagery; NO literal objection quotes or ad copy as text overlay; NO maps, addresses, or exact city landmarks; NO demographic or compensation modeling cues. Drives action: hire_cta.
    provenance:
      source_rules: rules/gauntlet_image.yaml
      deterministic: true
    brain_sim:
      enabled: false
      scoring_note: Gauntlet brain_simulator disabled by default
    load_policy: warm

