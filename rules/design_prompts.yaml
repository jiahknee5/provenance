# Design prompt database — reference catalog for image prompts (and future copy slots).
# Loader: pipeline/personalization/design_prompts.py
# Runtime image generation still uses rules/*_image.yaml via image_gen (v1 unchanged).
version: 1

meta:
  description: >-
    Human-editable reference database of assembled image prompts with resolved examples.
    Copy lane entries document slot assembly (no LLM prompts today). Image entries
    mirror intent templates in rules/gauntlet_image.yaml and rules/planet_image.yaml
    without duplicating full YAML — use source_rules + example_resolved for staging.
  consumers:
    - image_gen
    - marketer_console
    - demo_nav
    - warm_hero_cache
  copy_path_note: >-
    Gauntlet/Planet replica copy is deterministic slot substitution (GENERIC + ad_variant.page
    + objection reframes). No prompt strings — see kind=copy_slot entries for slot references.
  placeholders:
    product: "product_context from tenant image YAML"
    intent_id: "primary intent id from selection"
    conversion_goal: "intent.conversion_goal"
    sales_technique: "intent.sales_technique"
    environment: "industry_env[industry] — tier ≥ 2 only"
    region: "geo-IP region label — tier ≥ 1, allude-only mood"
    objection_metaphor: "objection_metaphors[top_objection]"
    ad_metaphor: "ad_metaphors[ad_variant_id]"
    accent_color: "brand.accent_color"
    audience_route: "b2b_hire | b2b_upskill | individual | enterprise | selfserve | research | neutral"
    channel: "ad | email | search | direct"

tenants:
  gauntlet:
    source_rules: rules/gauntlet_image.yaml
    surfaces:
      hero:
        intents:
          - peer_proof
          - message_match
          - authority
          - aspiration
          - loss_avoidance
        entry_ids:
          - gauntlet.hero.peer_proof.direct
          - gauntlet.hero.peer_proof.email
          - gauntlet.hero.message_match.ad
          - gauntlet.hero.authority.direct
          - gauntlet.hero.aspiration.ad
          - gauntlet.hero.loss_avoidance.ad
      og:
        intents:
          - message_match
        entry_ids:
          - gauntlet.og.message_match.ad
  planet:
    source_rules: rules/planet_image.yaml
    surfaces:
      hero:
        intents:
          - regional_truth
          - change_proof
        entry_ids:
          - planet.hero.regional_truth.tier0
          - planet.hero.regional_truth.region
          - planet.hero.change_proof.tier0
          - planet.hero.change_proof.region
      motion:
        intents:
          - regional_truth
        entry_ids:
          - planet.motion.regional_truth.timelapse

