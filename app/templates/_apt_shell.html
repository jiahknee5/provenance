{# Shared apt console-shell chrome (CSS). Include in <head>. Colors hardcoded — portal
   mounts don't serve the shared stylesheet, so each page carries its own. Page-specific
   card CSS stays in the page. #}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fa; --surface:#fff; --ink:#0f1729; --body:#3f4a5c; --muted:#71809a;
    --line:#e4e8f0; --line2:#eef1f6;
    --brand:#2E6FF5; --brand-d:#1B4DD1; --brand-t:#eaf1ff;
    --hs:#ff7a59; --x:#1d9bf0; --goog:#1a73e8; --ok:#129e6a;
    --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
    --sh2:0 4px 16px rgba(16,24,40,.08);
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
    --brand2:#1B4DD1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;gap:4px}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px;font-weight:800;font-size:19px;letter-spacing:-.02em}
  .brand .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-d));display:grid;place-items:center;color:#fff;font-size:15px}
  .navlbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 8px 5px}
  .ws-dd{margin-bottom:4px}
  .ws-dd summary{list-style:none;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer}
  .ws-dd summary::-webkit-details-marker{display:none}
  .ws-dd summary:hover{background:var(--line2)}
  .ws-dd[open] summary{border-color:#cfe0ff;background:var(--brand-t)}
  .ws-dd .lg{width:24px;height:24px;border-radius:6px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:0 0 auto}
  .ws-dd .nm{font-weight:700;font-size:12.5px;line-height:1.15}
  .ws-dd .nm span{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
  .ws-dd summary .cv{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .15s}
  .ws-dd[open] summary .cv{transform:rotate(180deg)}
  .ws-menu{margin-top:4px;border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:var(--sh)}
  .ws-mi{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--body)}
  .ws-mi:hover{background:var(--line2)}
  .ws-mi.on{color:var(--brand-d)}
  .ws-mi .lg{width:20px;height:20px;border-radius:5px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:10px;flex:0 0 auto}
  .ws-mi .ck{margin-left:auto;color:var(--brand);font-weight:800}
  .ws-mi.add{color:var(--brand);font-weight:700;border-top:1px solid var(--line2);margin-top:3px;padding-top:9px}
  .ws-mi.add .lg{background:var(--brand-t);color:var(--brand);border:1px dashed #b9d0ff}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-weight:600;font-size:13px;color:var(--body)}
  .nav a .ic{width:16px;text-align:center;opacity:.7}
  .nav a:hover{background:var(--line2)}
  .nav a.on{background:var(--brand-t);color:var(--brand-d)}
  .nav a.on .ic{opacity:1}
  /* collapsible nav groups */
  .nav-group>summary.navlbl{cursor:pointer;list-style:none;display:flex;align-items:center}
  .nav-group>summary.navlbl::-webkit-details-marker{display:none}
  .nav-group>summary.navlbl .gtw{margin-left:auto;font-size:9px;transition:transform .15s}
  .nav-group:not([open])>summary.navlbl .gtw{transform:rotate(-90deg)}
  .nav-group>summary.navlbl:hover{color:var(--ink)}
  /* nested nav (subsections + sub-sub-sections) */
  .nav-branch summary{list-style:none;display:flex;align-items:center;cursor:pointer;border-radius:8px}
  .nav-branch summary::-webkit-details-marker{display:none}
  .nav-branch summary a{flex:1}
  .nav-branch summary .tw{padding:0 8px;color:var(--muted);font-size:10px;transition:transform .15s}
  .nav-branch[open] summary .tw{transform:rotate(180deg)}
  .nav-branch summary:hover{background:var(--line2)}
  .nav-kids{display:flex;flex-direction:column;gap:1px;margin:1px 0 3px}
  .nav-kids a.kid{padding:6px 10px 6px 36px;font-size:12.5px;font-weight:600;color:var(--muted);border-left:2px solid var(--line);border-radius:0 8px 8px 0;margin-left:17px}
  .nav-kids a.kid:hover{color:var(--ink);background:var(--line2);border-left-color:var(--brand)}
  .nav-kids a.kid.on{color:var(--brand-d);background:var(--brand-t);border-left-color:var(--brand)}
  .nav-kids .kid-cap{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 10px 2px 36px;margin-left:17px}
  .nav-kids span.kid{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 36px;font-size:12.5px;font-weight:600;color:#b3bcc9;border-left:2px solid var(--line);margin-left:17px;cursor:default}
  .nav-kids span.kid em{font-style:normal;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--line2);border-radius:4px;padding:1px 5px}
  /* mobile nav-tree fold (wrapper lives in _apt_sidebar.html; invisible on desktop) */
  .m-menu>.m-menu-s{display:none}
  .m-menu-body{display:flex;flex-direction:column;gap:4px}
  .side .foot{margin-top:auto;display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding-top:12px}
  .side .foot .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#2E6FF5);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px}
  .side .foot .nm{font-size:12px;font-weight:600;line-height:1.2}
  .side .foot .nm span{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{min-height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 22px}
  .crumb{font-size:13px;color:var(--muted);font-weight:500}
  .crumb b{color:var(--ink);font-weight:700}
  .topbar .grow{flex:1}
  .searchbox{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--muted);font-size:12.5px;width:200px}
  .pill-live{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ok);background:#e7f7f0;border-radius:999px;padding:5px 10px}
  .pill-live .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .seg{display:inline-flex;gap:3px;background:var(--line2);border-radius:8px;padding:3px}
  .seg a{font-size:12px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:6px}
  .seg a.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
  .btn-primary{background:var(--brand);color:#fff;font-weight:700;font-size:12.5px;border:none;border-radius:8px;padding:9px 15px;cursor:pointer;box-shadow:var(--sh);text-decoration:none;white-space:nowrap}
  .content{padding:24px 26px 40px;max-width:1120px;width:100%}
  .hdr{margin-bottom:18px}
  .hdr h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .hdr p{font-size:13.5px;color:var(--body);margin-top:5px;max-width:66ch;line-height:1.5}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
  .kpi .n{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px}
  .kpi .l b{color:var(--ok)}
  .sec-lbl{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .sec-lbl h2{font-size:14px;font-weight:700}
  .sec-lbl .hint{font-size:12px;color:var(--muted)}
  .foothint{margin-top:22px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .foothint code{background:var(--line2);padding:1px 6px;border-radius:5px;font-size:11.5px}
  @media(max-width:820px){
    /* sticky top bar: brand + website dropdown on row 1, "Menu ▾" fold below it
       expanding the FULL nav tree vertically (groups/branches/kids all reachable) */
    .app{display:block}
    .side{position:sticky;top:0;z-index:80;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-right:none;border-bottom:1px solid var(--line);box-shadow:var(--sh)}
    .side>.navlbl,.side .foot{display:none}
    .brand{padding:2px 0;font-size:17px}
    .ws-dd{position:relative;margin:0 0 0 auto;min-width:0}
    .ws-dd summary{min-height:40px;padding:6px 10px}
    .ws-dd .ws-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);z-index:95;box-shadow:var(--sh2)}
    .m-menu{flex:1 0 100%;min-width:0}
    .m-menu>.m-menu-s{display:flex;align-items:center;justify-content:space-between;list-style:none;cursor:pointer;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:13px;color:var(--body)}
    .m-menu>.m-menu-s::-webkit-details-marker{display:none}
    .m-menu>.m-menu-s::after{content:"▾";color:var(--muted);font-size:11px;transition:transform .15s}
    .m-menu[open]>.m-menu-s::after{transform:rotate(180deg)}
    .m-menu[open]>.m-menu-s{border-color:#cfe0ff;background:var(--brand-t);color:var(--brand-d)}
    .m-menu-body{gap:2px;max-height:min(62vh,480px);overflow-y:auto;margin-top:8px;padding-bottom:4px}
    /* tap targets ≥40px through the whole tree */
    .nav a{min-height:40px;padding:10px 12px}
    .nav-group>summary.navlbl{min-height:40px;padding:12px 10px 6px;font-size:11px}
    .nav-branch summary .tw{padding:0 14px;min-height:40px;display:flex;align-items:center}
    .nav-kids a.kid,.nav-kids span.kid{min-height:40px;padding:10px 10px 10px 36px;display:flex;align-items:center}
    .nav-kids .kid-cap{padding-top:10px}
    /* chrome + content */
    .topbar{flex-wrap:wrap;gap:8px 10px;padding:10px 14px}
    .searchbox{display:none}
    .content{padding:16px 14px 36px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .gd-side{position:static}
    /* console header toggles: wrap + ellipsize long identity labels */
    .gd-tog,.gb-tog{flex-wrap:wrap;max-width:100%}
    .gd-tog a,.gb-tog a{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* tables scroll inside their own container instead of widening the page */
    .content table{display:block;width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  }
</style>
