{# HubSpot-style email preview — included on email channel gallery cards #}
<div class="email-card">
  <div class="email-card-hdr">
    <span class="email-src">HubSpot · {{ card.email_preview.recipient_hint }}</span>
  </div>
  <div class="email-inbox">
    <div class="email-subject">{{ card.email_preview.subject }}</div>
    <div class="email-preheader">{{ card.email_preview.preheader }}</div>
    <div class="email-body">
      <h2>{{ card.title }}</h2>
      <p class="story">{{ card.story }}</p>
      <span class="email-cta">{{ card.email_preview.cta }}</span>
    </div>
  </div>
</div>
<style>
  .email-card{border:1px solid #dfe3eb;border-radius:10px;overflow:hidden;background:#f5f8fa;margin-bottom:4px}
  .email-card-hdr{padding:8px 12px;background:#eaf0f6;border-bottom:1px solid #dfe3eb;font-size:11px;font-weight:600;color:#33475b}
  .email-inbox{padding:12px 14px;background:#fff}
  .email-subject{font-size:15px;font-weight:700;color:#33475b;margin-bottom:4px;line-height:1.3}
  .email-preheader{font-size:12.5px;color:#7c98b6;margin-bottom:10px;line-height:1.4}
  .email-body h2{font-size:14px;margin:0 0 6px;color:var(--ink)}
  .email-body .story{font-size:12.5px;margin-bottom:10px;color:#475569;line-height:1.45}
  .email-cta{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:#ff7a59;border-radius:6px;padding:6px 12px}
</style>
