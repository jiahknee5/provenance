<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="apt">
  <!-- apt "truth boundary" mark (original). Outline diamond = the truth boundary;
       solid inner diamond = the claim, structurally inside it. -->
  <defs>
    <linearGradient id="aptg" x1="7" y1="7" x2="57" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6FF5"/>
      <stop offset="1" stop-color="#1B4DD1"/>
    </linearGradient>
  </defs>
  <path d="M32 7 57 32 32 57 7 32Z" fill="none" stroke="url(#aptg)" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M32 20.5 43.5 32 32 43.5 20.5 32Z" fill="url(#aptg)" stroke="url(#aptg)" stroke-width="2" stroke-linejoin="round"/>
</svg>
